<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{width:100%;height:100%;padding:0;margin:0}.screen{overflow:hidden;width:100vw;height:100vh}.rainbow{background:linear-gradient(rgb(255 0 0) 0%,rgb(255 154 0) 10%,rgb(208 222 33) 20%,rgb(79 220 74) 30%,rgb(63 218 216) 40%,rgb(47 201 226) 50%,rgb(28 127 238) 60%,rgb(95 21 242) 70%,rgb(186 12 248) 80%,rgb(251 7 217) 90%,rgb(255 0 0) 100%)}.center{height:100%;width:100%;position:fixed;display:flex;justify-content:center;align-items:center}.backdrop{font-size:xx-large;background-color:rgb(0 0 0 / .6);border-radius:1rem;color:#fff0;position:absolute}.jiggle{animation:jiggle 400ms infinite alternate}.text-clip{z-index:2;color:#fff0;background-clip:text}.fixed{position:fixed}@keyframes jiggle{0%{padding:1rem;font-size:large}100%{padding:1.5rem}}.showUp{bottom:0;right:10%;animation:showUp 1s infinite alternate;scale:150%;z-index:2}@keyframes showUp{0%{transform:translateY(100%)}100%{transform:translateY(-20%)}}.sisypus{animation:sisypus 2s infinite normal linear}@keyframes sisypus{0%{scale:100%;opacity:0}50%{scale:150%;opacity:.5}100%{scale:200%;opacity:0}}.rotate{animation:rotate 1s infinite normal linear}@keyframes rotate{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
</style>
    <title>AUTISM Hello, World!</title>
</head>
<body>
    <div class="screen rainbow" style="overflow: hidden;">
        <div class="center">
            <div class="jiggle backdrop">Hello, World!</div>
            <h1 class="jiggle rainbow text-clip">Hello, World!</h1>
        </div>
        <div class="fixed showUp">
            <img src="https://i.imgflip.com/7gcrf6.jpg" alt="">
        </div>
        <div class="fixed center sisypus">
            <img src="https://thesquishylab.com/uploads/2024/07/1720567615421-sisyphus.jpeg" alt="">
        </div>
        <div style="left:10%; top: 10%;" class="fixed rotate">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLCTe4skxn9u9jk6edqF7kRb1vhO1c8UGDmg&s" alt="">
        </div>
        <div class="fixed" style="bottom: 0;">
            <iframe width="195" height="315" src="https://www.youtube.com/embed/zZ7AimPACzc?si=KvwWKcoB5a7HxFQm?autoplay=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay;" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
